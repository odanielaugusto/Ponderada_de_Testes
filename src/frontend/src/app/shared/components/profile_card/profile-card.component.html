<div class="bg-red-color ™flex h-64">
    <div class="flex flex-1">
        <img [src]="photo" alt="foto de perfil" class="w-24 h-24 rounded-full">
    </div>
    <div class="flex flex-col">
        <div class="flex gap-4 text-red-color">
            <div class="flex flex-col items-center justify-between">
                <span>{{name}}teste</span>
                <span>{{deficiency || profission}}</span>
            </div>
            <div class="flex flex-col items-center justify-between">
                <span>{{assistive_technology}}teste</span>
                <span>{{registration}}</span>
            </div>
            <div class="flex flex-col items-center justify-between">
                <span>{{course}}</span>
            </div>
        </div>
        <div class="flex gap-4"></div>
    </div>
</div>
