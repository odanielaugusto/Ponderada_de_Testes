<div class="relative w-full max-w-xs">
    <div class="flex justify-between items-center w-full px-4 py-2 text-left bg-pink-custom border-2 rounded-md shadow-sm hover:border-gray-400 focus:outline-none cursor-pointer transition-colors duration-200"
        (click)="toggleDropdown()">
        <span class="block truncate">
            {{ selectedOption || placeholder }}
        </span>
        <span class="flex items-center ml-2 transition-transform duration-200" [ngClass]="{'rotate-180': isOpen}">
            <svg class="w-4 h-4 text-gray-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                fill="currentColor">
                <path fill-rule="evenodd"
                    d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                    clip-rule="evenodd" />
            </svg>
        </span>
    </div>
    <div *ngIf="isOpen"
        class="absolute z-10 w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg overflow-hidden">
        <div class="p-2 border-b border-gray-200">
            <input type="text" [(ngModel)]="searchText" (click)="$event.stopPropagation()" (input)="filterOptions()"
                placeholder="Pesquisar..."
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        </div>
        <div class="max-h-60 overflow-y-auto">
            <ul class="py-1">
                <li *ngFor="let option of filteredOptions"
                    class="px-4 py-2 cursor-pointer hover:bg-gray-100 transition-colors duration-150"
                    [ngClass]="{'bg-blue-50 font-medium text-blue-700': option === selectedOption}"
                    (click)="selectOption(option)">
                    {{ option }}
                </li>
                <li *ngIf="filteredOptions.length === 0" class="px-4 py-2 text-gray-500 italic">
                    Nenhum resultado encontrado
                </li>
            </ul>
        </div>
    </div>
</div>
