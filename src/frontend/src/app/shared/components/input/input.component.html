<div class="flex flex-col gap-[8px]">
    <label 
    class="pl-[12px] leading-none red-custom font-black" 
    id="label" 
    for="text-input">
        {{ label }}
    </label>
    <input 
        class="bg-(--pink-color) 
            rounded-xl
            border-2
            border-(--pink-color)
            focus:border-(--red-color)
            outline-none
            transition-all
            duration-200
            px-[12px]"
        id="text-input"
        (input)="onInputChanges($event)"
        [attr.type]="type"
        [ngStyle]="{ 'width': width, 'height': height }"
    />
</div>
