<div class="flex flex-col gap-[8px]">
    <label 
    class="pl-[12px] leading-none text-[#AF2929]" 
    id="label" 
    for="text-input">
        {{ label }}
    </label>
    <input 
        class="bg-[#FBEBE6] 
            rounded-xl
            border-2
            border-[#FBEBE6]
            focus:border-[#AF2929]
            outline-none
            transition-all
            duration-200
            px-[12px]"
        id="text-input"
        [attr.type]="type"
        [ngStyle]="{ 'width': width, 'height': height }"
    />
</div>
